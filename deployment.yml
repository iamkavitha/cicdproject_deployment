apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicdproject
  labels:
    app: cicdproject
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicdproject
  template:
    metadata:
      labels:
        app: cicdproject
    spec:
      containers:
        - name: cicdproject
          image: 20223049/ultimate-cicd:8
          ports:
            - containerPort: 8080